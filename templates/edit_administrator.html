{% extends "layout.html" %}

{% block title %}Edit Administrator - University Administrator Directory{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Edit Administrator</h2>
    </div>
    <div class="card-content">
        <form method="POST" action="{{ url_for('edit_administrator', admin_id=admin.id) }}">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" value="{{ admin.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" value="{{ admin.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="position">Position *</label>
                <input type="text" id="position" name="position" value="{{ admin.position }}" required>
            </div>
            
            <input type="hidden" name="department" value="{{ admin.department }}">

            
            <div class="form-group">
                <label for="officeAddress">Office Address</label>
                <input type="text" id="officeAddress" name="officeAddress" value="{{ admin.officeAddress if admin.officeAddress else '' }}">
            </div>
            
            <div class="form-group text-center">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
